          | 15  | 1.09 | 1.07 | 1.03 | 1.05 | 1.02 | 0.97 | 0.97 | 0.94 | 0.87 | 0.80 | 0.76 | 0.67 |
          | 20  | 1.12 | 1.10 | 1.06 | 1.07 | 1.05 | 1.00 | 1.01 | 0.98 | 0.91 | 0.80 | 0.76 | 0.67 |
