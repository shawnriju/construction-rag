      Class A: structure/component max dimension < 20 m. Class B: 20-50 m. Class C: > 50 m.

      | Height (m) | Cat 1 A | Cat 1 B | Cat 1 C | Cat 2 A | Cat 2 B | Cat 2 C | Cat 3 A | Cat 3 B | Cat 3 C | Cat 4 A | Cat 4 B | Cat 4 C |
      |---|---|---|---|---|---|---|---|---|---|---|---|---|
    parts:
